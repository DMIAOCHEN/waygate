# 见设计文档 §6：pre-commit 只管格式与文件卫生；pre-push 跑收口门禁。
pre-commit:
  parallel: true
  commands:
    format:
      # 刻意不含 md：`docs/` 与 `*.md` 不参与自动格式化（prose 的换行是刻意的）。
      # 另外这里不能用目录扫描 —— 显式传文件会绕过 oxfmt 的 ignorePatterns，
      # 于是被"忽略"的 markdown 反而会被当成待格式化文件而报错。
      glob: '*.{ts,tsx,json,jsonc,yml,yaml}'
      run: pnpm exec oxfmt --write {staged_files}
      stage_fixed: true
    newline:
      # 规矩：文件末尾恰好一个换行。--check 同时报尾随空白与缺尾换行。
      run: git diff --cached --check

pre-push:
  commands:
    gate:
      run: pnpm gate
